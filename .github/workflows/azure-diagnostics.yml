name: Azure production diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    environment: azure-paper
    steps:
      - name: Sign in to Azure with workload identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download App Service diagnostics
        run: |
          app=$(az webapp list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "[?starts_with(name, 'sarthitradingweb')].name | [0]" \
            --output tsv)
          az webapp log download \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "$app" \
            --log-file diagnostics.zip

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: app-service-diagnostics
          path: diagnostics.zip
          retention-days: 1
