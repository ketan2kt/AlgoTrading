name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  entry-path-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require historical entry-path impact review for entry-code changes
        shell: pwsh
        run: ./scripts/verify-entry-path-review.ps1 -Base '${{ github.event.pull_request.base.sha || github.event.before }}' -Head '${{ github.event.pull_request.head.sha || github.sha }}'
      - name: Check app-only deployment fallback
        run: python3 scripts/test-deploy-infra-baseline.py

  backend:
    runs-on: ubuntu-latest
    env:
      RUN_POSTGRES_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore TradingSystem.slnx
      - run: dotnet build TradingSystem.slnx --no-restore --configuration Release
      - run: dotnet test TradingSystem.slnx --no-build --configuration Release
      - run: dotnet list TradingSystem.slnx package --vulnerable --include-transitive

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-system-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: trading-system-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:ci
      - run: npm audit --audit-level=high
