name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  entry-path-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require historical entry-path impact review for entry-code changes
        shell: pwsh
        run: ./scripts/verify-entry-path-review.ps1 -Base '${{ github.event.pull_request.base.sha || github.event.before }}' -Head '${{ github.event.pull_request.head.sha || github.sha }}'
      - name: Check app-only deployment fallback
        run: |
          python3 scripts/test-deploy-infra-baseline.py
          python3 scripts/test-check-website-schema-ready.py

  backend:
    runs-on: ubuntu-latest
    env:
      RUN_POSTGRES_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore TradingSystem.slnx
      - run: dotnet build TradingSystem.slnx --no-restore --configuration Release /p:UseAppHost=false /p:InformationalVersion="1.0.0+${GITHUB_SHA}"
      - name: Run protected-session regressions
        run: |
          dotnet test TradingSystem.slnx --no-build -c Release --filter Category=DeploymentRegression \
            --logger trx --results-directory "$RUNNER_TEMP/protected"
          python3 - "$RUNNER_TEMP/protected" <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          counters = [ET.parse(p).find(".//{*}Counters") for p in pathlib.Path(sys.argv[1]).glob("*.trx")]
          if not any(c is not None and int(c.get("passed", 0)) > 0 for c in counters):
              sys.exit("Protected-session gate did not run any passing tests.")
          PY
      - name: Run remaining backend tests
        run: dotnet test TradingSystem.slnx --no-build -c Release --filter 'Category!=DeploymentRegression'
      - run: dotnet list TradingSystem.slnx package --vulnerable --include-transitive
      - name: Publish tested backend binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          dotnet publish src/TradingSystem.Api/TradingSystem.Api.csproj --no-build --no-restore \
            -c Release /p:UseAppHost=false /p:InformationalVersion="1.0.0+${GITHUB_SHA}" -o "$RUNNER_TEMP/api"
          tar -C "$RUNNER_TEMP/api" -czf "$RUNNER_TEMP/api.tgz" .
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: ci-api
          path: ${{ runner.temp }}/api.tgz
          if-no-files-found: error
          overwrite: true
          retention-days: 7
          compression-level: 0

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-system-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: trading-system-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:ci
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: ci-browser
          path: trading-system-web/dist/trading-system-web/browser/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 7

  release-package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, entry-path-review]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ci-api
          path: inputs
      - uses: actions/download-artifact@v4
        with:
          name: ci-browser
          path: browser
      - name: Assemble release from checked outputs
        run: |
          mkdir -p app release
          tar -xzf inputs/api.tgz -C app
          test -s app/TradingSystem.Api.dll
          test -s browser/index.html
          mkdir -p app/wwwroot
          cp -R browser/. app/wwwroot/
          (cd app && zip -qr ../release/trading-system.zip .)
          cd release
          sha256sum trading-system.zip > package.sha256
          printf '%s\n' "$GITHUB_SHA" > source.sha
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-${{ github.sha }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
