name: Azure controlled-live deployment

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Type DEPLOY-LIVE to deploy the armed-controlled live-capable build
        required: true
      force_infrastructure:
        description: Reapply Bicep even if the verified infrastructure is unchanged
        type: boolean
        default: false
      ci_run_id:
        description: Successful main push CI run that produced the release package
        required: true
        type: string
      include_recorder:
        description: Deploy and activate the approved independent recorder after the website
        type: boolean
        default: false
      emergency_recorder_restart:
        description: Explicitly approved emergency recorder repair during market hours
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: azure-paper-production
  cancel-in-progress: false

jobs:
  recorder:
    needs: deploy
    if: inputs.include_recorder && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/replay-recorder-deploy.yml
    with:
      ci_run_id: ${{ inputs.ci_run_id }}
      emergency_restart: ${{ inputs.emergency_recorder_restart }}
    secrets: inherit
  deploy:
    if: inputs.deploy == 'DEPLOY-LIVE' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: azure-paper
    steps:
      - uses: actions/checkout@v4

      - name: Verify successful main CI and exact release package
        env:
          CI_RUN: ${{ inputs.ci_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CI_RUN" =~ ^[1-9][0-9]*$ ]]
          attempt=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN" | jq -er \
            --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" \
            'select(.path == ".github/workflows/ci.yml" and .event == "push" and
              .head_branch == "main" and .head_sha == $sha and .head_repository.full_name == $repo and
              .status == "completed" and .conclusion == "success") | .run_attempt')
          gh run download "$CI_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "deploy-$GITHUB_SHA-$attempt" --dir "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          test "$(cat source.sha)" = "$GITHUB_SHA"
          sha256sum trading-system.zip | cmp - package.sha256
          unzip -tq trading-system.zip
          echo "Verified package from main CI run $CI_RUN, attempt $attempt, commit $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"

      - name: Sign in to Azure with workload identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check previous successful infrastructure baseline
        id: baseline
        if: github.ref == 'refs/heads/main' && !inputs.force_infrastructure
        env:
          GH_TOKEN: ${{ github.token }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          PG_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMINISTRATOR_PASSWORD }}
        run: |
          # Only a successful previous deployment from this workflow on main is trusted.
          # Missing/expired artifacts, drift or unavailable read access take the original path.
          previous=$(gh run list --workflow azure-deploy.yml --event workflow_dispatch \
            --limit 10 --json databaseId,headBranch,conclusion \
            --jq "map(select(.databaseId < ${GITHUB_RUN_ID}))[0] | select(.headBranch == \"main\" and .conclusion == \"success\") | .databaseId") || previous=""
          if [[ "$previous" =~ ^[0-9]+$ ]] && \
             gh run download "$previous" -n verified-infra-v1 -D "$RUNNER_TEMP/prior-infra" && \
             python3 scripts/deploy-infra-baseline.py reuse "$RUNNER_TEMP/prior-infra/baseline.json"; then
            echo "Using verified infrastructure from successful run $previous."
          else
            echo "No matching verified baseline. Running full infrastructure deployment."
          fi

      - name: Resolve deployment infrastructure
        id: infrastructure
        env:
          REUSE: ${{ steps.baseline.outputs.reuse }}
        run: |
          if [[ "$REUSE" == true ]]; then
            echo "app=${{ steps.baseline.outputs.webAppName }}" >> "$GITHUB_OUTPUT"
            echo "postgres_host=${{ steps.baseline.outputs.postgresHostName }}" >> "$GITHUB_OUTPUT"
            echo "postgres_database=${{ steps.baseline.outputs.postgresDatabaseName }}" >> "$GITHUB_OUTPUT"
            echo "postgres_login=${{ steps.baseline.outputs.postgresAdministratorLogin }}" >> "$GITHUB_OUTPUT"
            echo 'Release path: **app only** (verified infrastructure).' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          outputs=$(az deployment group create \
            --name "paper-${GITHUB_RUN_ID}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters \
              location=centralindia \
              prefix=sarthitrading \
              postgresAdministratorPassword="${{ secrets.POSTGRES_ADMINISTRATOR_PASSWORD }}" \
            --query properties.outputs -o json)
          printf '%s' "$outputs" > "$RUNNER_TEMP/infra-outputs.json"
          echo 'Release path: **full infrastructure**.' >> "$GITHUB_STEP_SUMMARY"
          echo "app=$(jq -r '.webAppName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "postgres_host=$(jq -r '.postgresHostName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "postgres_database=$(jq -r '.postgresDatabaseName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "postgres_login=$(jq -r '.postgresAdministratorLogin.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"

      - name: Configure application settings without replacing secrets
        run: |
          az webapp config appsettings set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ steps.infrastructure.outputs.app }}" \
            --settings \
              ASPNETCORE_ENVIRONMENT=Production \
              Trading__Mode=Paper \
              AllowedHosts='*' \
              DataProtection__KeysPath=/home/data-protection-keys \
              DatabaseInitialization__ApplyMigrations=false \
              PaperTradeReset__Enabled=false \
              MarketData__LiveNifty__Enabled=true \
              PaperTrading__Automation__Enabled=true \
              LiveExecution__BuildEnabled=true \
              LiveExecution__PaperParityMode=PaperFillAndLifecycle \
              "ConnectionStrings__TradingDatabase=Host=${{ steps.infrastructure.outputs.postgres_host }};Port=5432;Database=${{ steps.infrastructure.outputs.postgres_database }};Username=${{ steps.infrastructure.outputs.postgres_login }};Password=${{ secrets.POSTGRES_ADMINISTRATOR_PASSWORD }};SSL Mode=Require;Trust Server Certificate=false" \
            --output none

      - name: Verify Groww relay secrets survived infrastructure deployment
        run: |
          app="${{ steps.infrastructure.outputs.app }}"
          for setting in \
            Groww__ExecutionApiBaseUrl \
            GROWW_EXECUTION_RELAY_KEY \
            GROWW_TOTP_API_KEY \
            GROWW_TOTP_SECRET; do
            value=$(az webapp config appsettings list \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "$app" \
              --query "[?name=='$setting'].value | [0]" -o tsv)
            if [[ -z "$value" ]]; then
              echo "Required Groww setting '$setting' is missing after infrastructure deployment." >&2
              exit 1
            fi
          done

      - name: Deploy application package
        run: |
          # Never mutate App Service settings immediately before ZipDeploy. Even an
          # apparently completed settings call can restart the SCM container minutes
          # later and cancel the active deployment.
          deployed=false
          for attempt in 1 2 3; do
            if az webapp deploy \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ steps.infrastructure.outputs.app }}" \
              --src-path "$RUNNER_TEMP/release/trading-system.zip" \
              --type zip \
              --clean true \
              --restart true; then
              deployed=true
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "ZipDeploy attempt $attempt failed; allowing Kudu to recover before retry."
              sleep $((attempt * 20))
            fi
          done
          if [[ "$deployed" != true ]]; then
            echo "ZipDeploy failed after three bounded attempts." >&2
            exit 1
          fi

      - name: Check the new package before enabling migrations
        id: migration
        if: steps.baseline.outputs.reuse == 'true'
        env:
          APP: ${{ steps.infrastructure.outputs.app }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          # /health/ready checks the exact deployed code's pending migrations.
          # Never skip controlled migrations based on the outgoing container.
          if python3 scripts/check-website-schema-ready.py; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'Exact package and schema verified without additional app restarts.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Schema readiness was not established; use the controlled migration path.'
          fi

      - name: Enable database initialization for the deployed package
        id: enable_migration
        if: steps.migration.outputs.skip != 'true'
        run: |
          # The package is present before this management operation. This restart now
          # starts that package in controlled migration mode without racing ZipDeploy.
          diagnostics_key=$(az webapp config appsettings list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ steps.infrastructure.outputs.app }}" \
            --query "[?name=='Diagnostics__ReadOnlyApiKey'].value | [0]" -o tsv)
          if [[ -z "$diagnostics_key" ]]; then
            diagnostics_key=$(openssl rand -hex 32)
          fi
          az webapp config appsettings set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ steps.infrastructure.outputs.app }}" \
            --settings DatabaseInitialization__ApplyMigrations=true \
              LiveExecution__BuildEnabled=true \
              PaperTradeReset__Enabled=false \
              "Diagnostics__ReadOnlyApiKey=$diagnostics_key" \
            --output none
          unset diagnostics_key

      - name: Wait for database initialization
        if: steps.migration.outputs.skip != 'true'
        run: |
          app="${{ steps.infrastructure.outputs.app }}"
          expected="1.0.0+${GITHUB_SHA}"
          for attempt in {1..90}; do
            if curl --fail --silent \
              "https://${app}.azurewebsites.net/health/ready" > /dev/null; then
              actual=$(curl --fail --silent \
                "https://${app}.azurewebsites.net/api/system/status" | jq -r '.buildVersion' || true)
              if [[ "$actual" == "$expected"* ]]; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "The new commit did not become ready after controlled migration." >&2
          exit 1

      - name: Disable database initialization
        if: >-
          always() && steps.infrastructure.outputs.app != '' && steps.enable_migration.outcome != ''
          && steps.enable_migration.outcome != 'skipped'
        run: |
          # Changing an App Service application setting already restarts the site.
          # A second immediate restart can cancel the new worker while it is starting.
          az webapp config appsettings set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ steps.infrastructure.outputs.app }}" \
            --settings DatabaseInitialization__ApplyMigrations=false \
              LiveExecution__BuildEnabled=true \
            --output none

      - name: Verify application after migration shutdown
        run: |
          app="${{ steps.infrastructure.outputs.app }}"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              "https://${app}.azurewebsites.net/health/ready" > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Application did not recover after disabling migration mode." >&2
          exit 1

      - name: Verify shadow strategy and controlled-live configuration
        run: |
          mode=$(az webapp config appsettings list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ steps.infrastructure.outputs.app }}" \
            --query "[?name=='Trading__Mode'].value | [0]" -o tsv)
          test "$mode" = "Paper"
          automation=$(az webapp config appsettings list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ steps.infrastructure.outputs.app }}" \
            --query "[?name=='PaperTrading__Automation__Enabled'].value | [0]" -o tsv)
          test "$automation" = "true"
          live=$(az webapp config appsettings list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ steps.infrastructure.outputs.app }}" \
            --query "[?name=='LiveExecution__BuildEnabled'].value | [0]" -o tsv)
          test "$live" = "true"
          parity_mode=$(az webapp config appsettings list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ steps.infrastructure.outputs.app }}" \
            --query "[?name=='LiveExecution__PaperParityMode'].value | [0]" -o tsv)
          test "$parity_mode" = "PaperFillAndLifecycle"

      - name: Verify deployed commit identity
        run: |
          app="${{ steps.infrastructure.outputs.app }}"
          expected="1.0.0+${GITHUB_SHA}"
          actual=$(curl --fail --silent --show-error \
            "https://${app}.azurewebsites.net/api/system/status" | jq -r '.buildVersion')
          if [[ "$actual" != "$expected"* ]]; then
            echo "App Service is running '$actual'; expected '$expected'." >&2
            exit 1
          fi

      - name: Prepare baseline for the next release
        id: prepare_baseline
        if: success() && github.ref == 'refs/heads/main'
        env:
          REUSE: ${{ steps.baseline.outputs.reuse }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          PG_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMINISTRATOR_PASSWORD }}
        run: |
          if [[ "$REUSE" == true ]]; then
            cp "$RUNNER_TEMP/prior-infra/baseline.json" "$RUNNER_TEMP/baseline.json"
          elif ! python3 scripts/deploy-infra-baseline.py capture "$RUNNER_TEMP/baseline.json" "$RUNNER_TEMP/infra-outputs.json"; then
            echo "::notice::No baseline captured; next release will take the full path."
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Store verified infrastructure baseline
        if: steps.prepare_baseline.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: verified-infra-v1
          path: ${{ runner.temp }}/baseline.json
          overwrite: true
          retention-days: 30

      - name: Capture sanitized deployment failure diagnostics
        if: failure() && steps.infrastructure.outputs.app != ''
        run: |
          app="${{ steps.infrastructure.outputs.app }}"
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "app=$app"
            echo "captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "deployment_history="
            az webapp log deployment list \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "$app" \
              --query "[0:5].{id:id,status:status,start:start_time,end:end_time,message:message}" \
              --output json || true
            echo "app_state="
            az webapp show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "$app" \
              --query "{state:state,availabilityState:availabilityState,hostName:defaultHostName}" \
              --output json || true
          } > deployment-failure-diagnostics.txt
          {
            echo "## Deployment failure diagnostics"
            echo "A sanitized diagnostic artifact was captured automatically."
            echo "No application settings, credentials, tokens or runtime request bodies are included."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment failure diagnostics
        if: failure() && steps.infrastructure.outputs.app != ''
        uses: actions/upload-artifact@v4
        with:
          name: deployment-failure-${{ github.run_id }}
          path: deployment-failure-diagnostics.txt
          if-no-files-found: error
          retention-days: 14
