name: Azure controlled-live deployment

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Type DEPLOY-LIVE to deploy the armed-controlled live-capable build
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-paper-production
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.deploy == 'DEPLOY-LIVE'
    runs-on: ubuntu-latest
    environment: azure-paper
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure with workload identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        id: infrastructure
        run: |
          outputs=$(az deployment group create \
            --name "paper-${GITHUB_RUN_ID}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters \
              location=centralindia \
              prefix=sarthitrading \
              postgresAdministratorPassword="${{ secrets.POSTGRES_ADMINISTRATOR_PASSWORD }}" \
            --query properties.outputs -o json)
          echo "app=$(jq -r '.webAppName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "postgres_host=$(jq -r '.postgresHostName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "postgres_database=$(jq -r '.postgresDatabaseName.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"
          echo "postgres_login=$(jq -r '.postgresAdministratorLogin.value' <<< "$outputs")" >> "$GITHUB_OUTPUT"

      - name: Configure application settings without replacing secrets
        run: |
          az webapp config appsettings set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ steps.infrastructure.outputs.app }}" \
            --settings \
              ASPNETCORE_ENVIRONMENT=Production \
              Trading__Mode=Paper \
              AllowedHosts='*' \
              DataProtection__KeysPath=/home/data-protection-keys \
              DatabaseInitialization__ApplyMigrations=false \
              MarketData__LiveNifty__Enabled=true \
              PaperTrading__Automation__Enabled=true \
              LiveExecution__BuildEnabled=true \
              LiveExecution__RequirePaperPromotion=false \
              LiveExecution__AllowResearchSources=true \
              LiveExecution__MaximumLotsPerOrder=5 \
              LiveExecution__ControlledTestLotsPerOrder=5 \
              "ConnectionStrings__TradingDatabase=Host=${{ steps.infrastructure.outputs.postgres_host }};Port=5432;Database=${{ steps.infrastructure.outputs.postgres_database }};Username=${{ steps.infrastructure.outputs.postgres_login }};Password=${{ secrets.POSTGRES_ADMINISTRATOR_PASSWORD }};SSL Mode=Require;Trust Server Certificate=false" \
            --output none

      - name: Verify Groww relay secrets survived infrastructure deployment
        run: |
          app="${{ steps.infrastructure.outputs.app }}"
          for setting in \
            Groww__ExecutionApiBaseUrl \
            GROWW_EXECUTION_RELAY_KEY \
            GROWW_TOTP_API_KEY \
            GROWW_TOTP_SECRET; do
            value=$(az webapp config appsettings list \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "$app" \
              --query "[?name=='$setting'].value | [0]" -o tsv)
            if [[ -z "$value" ]]; then
              echo "Required Groww setting '$setting' is missing after infrastructure deployment." >&2
              exit 1
            fi
          done

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: trading-system-web/package-lock.json

      - name: Build Angular application
        working-directory: trading-system-web
        run: |
          npm ci
          npm run build

      - name: Publish ASP.NET Core application
        run: |
          rm -rf src/TradingSystem.Api/wwwroot/*
          cp -R trading-system-web/dist/trading-system-web/browser/. src/TradingSystem.Api/wwwroot/
          dotnet publish src/TradingSystem.Api/TradingSystem.Api.csproj \
            --configuration Release \
            --output publish \
            /p:UseAppHost=false \
            /p:InformationalVersion="1.0.0+${GITHUB_SHA}"
          cd publish
          zip -r ../trading-system.zip .

      - name: Deploy application package
        run: |
          # Never mutate App Service settings immediately before ZipDeploy. Even an
          # apparently completed settings call can restart the SCM container minutes
          # later and cancel the active deployment.
          az webapp deploy \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ steps.infrastructure.outputs.app }}" \
            --src-path trading-system.zip \
            --type zip \
            --clean true \
            --restart true

      - name: Enable database initialization for the deployed package
        run: |
          # The package is present before this management operation. This restart now
          # starts that package in controlled migration mode without racing ZipDeploy.
          az webapp config appsettings set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ steps.infrastructure.outputs.app }}" \
            --settings DatabaseInitialization__ApplyMigrations=true \
              LiveExecution__BuildEnabled=true \
            --output none

      - name: Wait for database initialization
        run: |
          app="${{ steps.infrastructure.outputs.app }}"
          expected="1.0.0+${GITHUB_SHA}"
          for attempt in {1..90}; do
            if curl --fail --silent \
              "https://${app}.azurewebsites.net/health/ready" > /dev/null; then
              actual=$(curl --fail --silent \
                "https://${app}.azurewebsites.net/api/system/status" | jq -r '.buildVersion' || true)
              if [[ "$actual" == "$expected"* ]]; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "The new commit did not become ready after controlled migration." >&2
          exit 1

      - name: Disable database initialization
        if: always() && steps.infrastructure.outputs.app != ''
        run: |
          # Changing an App Service application setting already restarts the site.
          # A second immediate restart can cancel the new worker while it is starting.
          az webapp config appsettings set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ steps.infrastructure.outputs.app }}" \
            --settings DatabaseInitialization__ApplyMigrations=false \
              LiveExecution__BuildEnabled=true \
            --output none

      - name: Verify application after migration shutdown
        run: |
          app="${{ steps.infrastructure.outputs.app }}"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              "https://${app}.azurewebsites.net/health/ready" > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Application did not recover after disabling migration mode." >&2
          exit 1

      - name: Verify shadow strategy and controlled-live configuration
        run: |
          mode=$(az webapp config appsettings list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ steps.infrastructure.outputs.app }}" \
            --query "[?name=='Trading__Mode'].value | [0]" -o tsv)
          test "$mode" = "Paper"
          automation=$(az webapp config appsettings list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ steps.infrastructure.outputs.app }}" \
            --query "[?name=='PaperTrading__Automation__Enabled'].value | [0]" -o tsv)
          test "$automation" = "true"
          live=$(az webapp config appsettings list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ steps.infrastructure.outputs.app }}" \
            --query "[?name=='LiveExecution__BuildEnabled'].value | [0]" -o tsv)
          test "$live" = "true"
          research_sources=$(az webapp config appsettings list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ steps.infrastructure.outputs.app }}" \
            --query "[?name=='LiveExecution__AllowResearchSources'].value | [0]" -o tsv)
          test "$research_sources" = "true"

      - name: Verify deployed commit identity
        run: |
          app="${{ steps.infrastructure.outputs.app }}"
          expected="1.0.0+${GITHUB_SHA}"
          actual=$(curl --fail --silent --show-error \
            "https://${app}.azurewebsites.net/api/system/status" | jq -r '.buildVersion')
          if [[ "$actual" != "$expected"* ]]; then
            echo "App Service is running '$actual'; expected '$expected'." >&2
            exit 1
          fi
