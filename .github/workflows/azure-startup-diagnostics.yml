name: Azure startup diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: azure-paper
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Read startup failure
        run: |
          app=$(az webapp list --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query "[?starts_with(name, 'sarthitradingweb')].name | [0]" -o tsv)
          az webapp log startup show --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "$app"
