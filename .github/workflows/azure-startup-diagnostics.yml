name: Azure startup diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: azure-paper
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Recover site after timed-out migration startup
        run: |
          app=$(az webapp list --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query "[?starts_with(name, 'sarthitradingweb')].name | [0]" -o tsv)
          az webapp config appsettings set --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "$app" --settings DatabaseInitialization__ApplyMigrations=false --output none
          az webapp restart --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "$app"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "https://sarthico.com/health/ready"; then
              curl --fail --silent --show-error "https://sarthico.com/api/deployment"
              exit 0
            fi
            sleep 10
          done
          az webapp log startup show --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "$app"
          exit 1
